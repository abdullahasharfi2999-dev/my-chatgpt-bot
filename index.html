<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Language ChatGPT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    #chatBox {
      background: #fff;
      border-radius: 15px;
      width: 100%;
      max-width: 600px;
      height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    #header {
      background: #4f46e5;
      color: white;
      padding: 15px 20px;
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
    }

    #messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
    }

    .message {
      margin-bottom: 15px;
      line-height: 1.5;
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      word-wrap: break-word;
    }

    .user {
      background: #e0e7ff;
      color: #1e3a8a;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .bot {
      background: #d1fae5;
      color: #065f46;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .error {
      background: #fee2e2;
      color: #dc2626;
      align-self: center;
      max-width: 90%;
      text-align: center;
    }

    #inputArea {
      display: flex;
      border-top: 1px solid #ddd;
      padding: 15px 20px;
      background: #fff;
    }

    #userInput {
      flex: 1;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }

    #userInput:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 5px rgba(79,70,229,0.3);
    }

    #sendBtn {
      margin-left: 10px;
      padding: 12px 20px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    #sendBtn:hover {
      background: #4338ca;
    }

    #sendBtn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    /* Scrollbar styling */
    #messages::-webkit-scrollbar {
      width: 6px;
    }
    #messages::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.2);
      border-radius: 3px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .typing {
      opacity: 0.7;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="chatBox">
    <div id="header">💬 Multi-Language ChatGPT</div>
    <div id="messages">
      <div class="message bot">
        <b>Bot:</b> Hello! I'm your AI assistant. How can I help you today?
      </div>
    </div>
    <div id="inputArea">
      <input type="text" id="userInput" placeholder="Type your message here..." />
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const messages = document.getElementById('messages');

    // Allow sending with Enter key
    userInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    async function sendMessage() {
      const msg = userInput.value.trim();
      if (!msg) return;

      // Disable input while processing
      userInput.disabled = true;
      sendBtn.disabled = true;

      // Add user message
      messages.innerHTML += `<div class="message user"><b>You:</b> ${msg}</div>`;
      userInput.value = '';
      messages.scrollTop = messages.scrollHeight;

      // Add typing indicator
      const typingIndicator = document.createElement('div');
      typingIndicator.className = 'message bot typing';
      typingIndicator.innerHTML = '<b>Bot:</b> Typing...';
      messages.appendChild(typingIndicator);
      messages.scrollTop = messages.scrollHeight;

      try {
        const response = await fetch('http://localhost:3000/chat', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message: msg })
        });

        // Remove typing indicator
        typingIndicator.remove();

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        const data = await response.json();
        
        if (data.error) {
          messages.innerHTML += `<div class="message error"><b>Error:</b> ${data.error}</div>`;
        } else {
          messages.innerHTML += `<div class="message bot"><b>Bot:</b> ${data.reply}</div>`;
        }

      } catch (error) {
        // Remove typing indicator
        typingIndicator.remove();
        
        messages.innerHTML += `<div class="message error"><b>Connection Error:</b> Make sure server is running on http://localhost:3000</div>`;
        console.error('Error:', error);
      }

      messages.scrollTop = messages.scrollHeight;
      
      // Re-enable input
      userInput.disabled = false;
      sendBtn.disabled = false;
      userInput.focus();
    }
  </script>
</body>
</html>
